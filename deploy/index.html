  <!-- Inline splash CSS — renders BEFORE any JS loads -->
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,-apple-system,sans-serif;overflow-x:hidden}

    /* Inline splash — shown instantly before Angular boots */
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      opacity: 1;
      transition: opacity 0.45s ease;
    }
    #app-splash.splash-out { opacity: 0; pointer-events: none; }

    #app-splash-logo {
      width: 96px;
      height: 96px;
      object-fit: contain;
      border-radius: 20px;
      animation: splash_pop 0.55s cubic-bezier(0.34,1.56,0.64,1) both;
      box-shadow: 0 8px 32px rgba(232,114,12,0.25);
    }
    #app-splash-name {
      font-family: 'Quicksand','Poppins',system-ui,sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: #1A2332;
      letter-spacing: -0.02em;
      animation: splash_up 0.5s cubic-bezier(0.22,1,0.36,1) 0.12s both;
    }
    #app-splash-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #E8720C;
      display: inline-block;
      margin-left: 3px;
      vertical-align: middle;
    }
    #app-splash-bar {
      width: 48px;
      height: 3px;
      border-radius: 99px;
      background: #ECECEC;
      overflow: hidden;
      animation: splash_up 0.5s ease 0.2s both;
    }
    #app-splash-bar::after {
      content: '';
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #E8720C, #2D6A4F);
      border-radius: 99px;
      animation: splash_prog 0.85s ease 0.15s forwards;
    }
    @keyframes splash_pop  { from { transform: scale(0.65); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes splash_up   { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes splash_prog { from { width: 0%; } to { width: 100%; } }

    /* Reserve space so content doesn't shift when Angular renders */
    app-root { display: block; min-height: 100vh; }
  </style>
