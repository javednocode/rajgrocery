<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&family=Manrope:wght@400..800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&family=Manrope:wght@400..800&display=swap"></noscript>

  <!-- Inline splash CSS — renders BEFORE any JS loads -->
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Manrope',system-ui,-apple-system,sans-serif;overflow-x:hidden;background:#FAF7F1}

    /* Inline splash — shown instantly before Angular boots */
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #FAF7F1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      opacity: 1;
      transition: opacity 0.45s ease;
    }
    #app-splash.splash-out { opacity: 0; pointer-events: none; }

    #app-splash-name {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 33px;
      font-weight: 600;
      color: #211A14;
      letter-spacing: -0.015em;
      animation: splash_up 0.7s cubic-bezier(0.22,1,0.36,1) 0.05s both;
    }
    #app-splash-sub {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #9C6B15;
      animation: splash_up 0.7s cubic-bezier(0.22,1,0.36,1) 0.16s both;
    }
    #app-splash-bar {
      width: 52px;
      height: 2px;
      border-radius: 99px;
      background: #E7DCCA;
      overflow: hidden;
      margin-top: 4px;
      animation: splash_up 0.6s ease 0.24s both;
    }
    #app-splash-bar::after {
      content: '';
      display: block;
      height: 100%;
      width: 0%;
      background: #17513F;
      border-radius: 99px;
      animation: splash_prog 0.9s ease 0.2s forwards;
    }
    @keyframes splash_up   { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes splash_prog { from { width: 0%; } to { width: 100%; } }

    /* Scroll progress — compositor-only (scaleX), rAF-batched below */
    #raj-progress {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10000;
      height: 3px;
      background: linear-gradient(90deg, #17513F, #2F7D63 55%, #E4A33B);
      transform: scaleX(0); transform-origin: 0 50%;
      pointer-events: none;
      will-change: transform;
    }

    /* Reserve space so content doesn't shift when Angular renders */
    app-root { display: block; min-height: 100vh; }

    @media (prefers-reduced-motion: reduce) {
      #app-splash, #app-splash-name, #app-splash-sub,
      #app-splash-bar, #app-splash-bar::after { animation: none !important; }
    }
  </style>
</head>
<body>

  <!-- Inline splash screen — visible IMMEDIATELY, before any JS executes -->
  <div id="app-splash" role="status" aria-label="Loading store">
    <div id="app-splash-name">Raj Grocery Store</div>
    <div id="app-splash-sub">Indian Grocery &middot; Hong Kong</div>
    <div id="app-splash-bar"></div>
  </div>

  <app-root></app-root>

  <script>
    // ── Service Worker ──
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').catch(function() {});
      });
    }

    // Exposed for Angular to call once the app has rendered
    window.__appHideSplash = function() {
      var el = document.getElementById('app-splash');
      if (!el) return;
      el.classList.add('splash-out');
      setTimeout(function() {
        if (el && el.parentNode) el.parentNode.removeChild(el);
      }, 450);
    };

    // Compatibility alias for existing callers
    window.__tdHideSplash = window.__appHideSplash;

    // Hard failsafe — remove after 4 seconds no matter what
    setTimeout(function() {
      if (window.__appHideSplash) window.__appHideSplash();
    }, 4000);

    // ── Scroll progress bar ──
    // rAF-batched and transform-driven so it never touches layout.
    // The rest of the site's motion is handled by the native scroll-story
    // directive engine in app/shared/directives.
    (function() {
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var bar = document.createElement('div');
      bar.id = 'raj-progress';
      document.body.insertBefore(bar, document.body.firstChild);
      var ticking = false;
      function paint() {
        ticking = false;
        var doc = document.documentElement;
        var max = doc.scrollHeight - window.innerHeight;
        var p = max > 0 ? (window.scrollY || doc.scrollTop) / max : 0;
        bar.style.transform = 'scaleX(' + (p < 0 ? 0 : p > 1 ? 1 : p).toFixed(4) + ')';
      }
      window.addEventListener('scroll', function() {
        if (!ticking) { ticking = true; requestAnimationFrame(paint); }
      }, { passive: true });
      paint();
    })();
  </script>
</body>
</html>
