<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Your Store - Online Store</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A reusable ecommerce storefront ready for your brand, catalog, customers, cart, checkout, and order management.">
  <meta name="keywords" content="ecommerce, online store, white-label ecommerce">
  <meta name="author" content="Your Store">
  <meta name="robots" content="index, follow">

  <!-- PWA -->
  <meta name="theme-color" content="#0F766E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Your Store">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/logo.svg">

  <!-- Open Graph -->
  <meta property="og:title" content="Your Store - Online Store">
  <meta property="og:description" content="A reusable ecommerce storefront ready for your next brand.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="/">
  <meta property="og:locale" content="en_US">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Your Store - Online Store">
  <meta name="twitter:description" content="A reusable ecommerce storefront ready for your next brand.">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="canonical" href="/">

  <!-- Non-blocking font loading (moved from CSS @import to prevent render blocking) -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"></noscript>

  <!-- DNS prefetch for resources loaded at runtime -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
</head>
<body>
  <app-root></app-root>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
