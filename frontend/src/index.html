<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kale Gida | Premium Groceries from India, Finland &amp; Germany</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Kale Gida — a premium international grocery marketplace. Authentic flavours from India, Finland and Germany, delivered fresh to your door.">
  <meta name="keywords" content="international grocery, Indian groceries, Finnish groceries, German groceries, premium food marketplace, Kale Gida">
  <meta name="author" content="Kale Gida">
  <meta name="robots" content="index, follow">

  <!-- PWA / App branding — will be overridden by SettingsService at runtime -->
  <meta name="theme-color" content="#1F4D3A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kale Gida">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/logo.svg">

  <!-- Open Graph — overridden dynamically by SettingsService -->
  <meta property="og:title" content="Kale Gida">
  <meta property="og:description" content="Premium groceries from India, Finland and Germany — delivered fresh.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="">
  <meta property="og:image" content="/logo.svg">
  <meta property="og:locale" content="en_FI">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Kale Gida">
  <meta name="twitter:description" content="Premium groceries from India, Finland and Germany — delivered fresh.">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="canonical" href="">

  <!-- DNS prefetch & preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">

  <!-- Preload critical assets -->
  <link rel="preload" href="/logo.svg" as="image" fetchpriority="high">
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400&family=Manrope:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap"></noscript>

  <!-- Inline splash CSS — renders BEFORE any JS loads -->
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Manrope',system-ui,-apple-system,sans-serif;overflow-x:hidden;background:#FAF6EF}

    /* Inline splash — shown instantly before Angular boots */
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #FAF6EF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      opacity: 1;
      transition: opacity 0.5s ease;
    }
    #app-splash.splash-out { opacity: 0; pointer-events: none; }

    #app-splash-name {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 34px;
      font-weight: 400;
      color: #211D16;
      letter-spacing: -0.02em;
      animation: splash_up 0.7s cubic-bezier(0.22,1,0.36,1) 0.05s both;
    }
    #app-splash-flags {
      display: flex;
      gap: 10px;
      font-size: 15px;
      letter-spacing: 0.04em;
      animation: splash_up 0.7s cubic-bezier(0.22,1,0.36,1) 0.18s both;
    }
    #app-splash-bar {
      width: 56px;
      height: 2px;
      border-radius: 99px;
      background: #E8E1D2;
      overflow: hidden;
      animation: splash_up 0.6s ease 0.26s both;
    }
    #app-splash-bar::after {
      content: '';
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1F4D3A, #C4622D);
      border-radius: 99px;
      animation: splash_prog 0.9s ease 0.2s forwards;
    }
    @keyframes splash_up   { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes splash_prog { from { width: 0%; } to { width: 100%; } }

    /* Reserve space so content doesn't shift when Angular renders */
    app-root { display: block; min-height: 100vh; }
  </style>
</head>
<body>

  <!-- Inline splash screen — visible IMMEDIATELY, before any JS executes -->
  <div id="app-splash" role="status" aria-label="Loading store">
    <div id="app-splash-name">Kale Gida</div>
    <div id="app-splash-flags"><span>🇮🇳</span><span>🇫🇮</span><span>🇩🇪</span></div>
    <div id="app-splash-bar"></div>
  </div>

  <app-root></app-root>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').catch(function() {});
      });
    }

    // Expose function for Angular to call when it's ready
    window.__appHideSplash = function() {
      var el = document.getElementById('app-splash');
      if (!el) return;
      el.classList.add('splash-out');
      setTimeout(function() {
        if (el && el.parentNode) el.parentNode.removeChild(el);
      }, 500);
    };

    // Compatibility alias for any existing code referencing the old function name
    window.__tdHideSplash = window.__appHideSplash;

    // Hard failsafe — remove after 4 seconds no matter what
    setTimeout(function() {
      if (window.__appHideSplash) window.__appHideSplash();
    }, 4000);
  </script>
</body>
</html>
